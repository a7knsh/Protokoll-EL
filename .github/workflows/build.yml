name: Build und Release

# Baut die Programme für Windows (.exe) und Linux (.AppImage) und legt sie unter "Releases" ab.
# Start: bei einer Änderung an package.json (z. B. neue Versionsnummer), bei einem Tag wie v0.1.0
# oder von Hand unter "Actions". Das Release heißt immer v<Version aus package.json>.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['package.json', '.github/workflows/build.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Protokoll-EL-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Protokoll-EL ${{ steps.version.outputs.tag }}
          body: |
            **Windows:** `Protokoll-EL-…-Setup.exe` installiert das Programm, `…-portable.exe` läuft ohne Installation.
            **Linux:** `Protokoll-EL-….AppImage` ausführbar machen (`chmod +x`) und starten.
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
          fail_on_unmatched_files: true
