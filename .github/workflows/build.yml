name: Build

# Baut die Installationsdateien für Windows und Linux.
# Start: von Hand unter "Actions" oder automatisch bei einem Tag wie v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Protokoll-EL-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
